---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "nebarilabs/admins"
    ignore:
      # Private org repo - not reachable by Dependabot; caller workflows pin
      # it as `uses: nebarilabs/.github/...@v2` and the moving v2 tag plus the
      # org sync propagate updates without Dependabot
      - dependency-name: "nebarilabs/.github"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: "daily"
    reviewers:
      - "nebarilabs/admins"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: "daily"
    reviewers:
      - "nebarilabs/admins"