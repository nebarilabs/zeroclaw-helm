---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "nebarilabs/admins"
    ignore:
      # Private org repo - not reachable by Dependabot; caller workflows pin
      # it as `uses: nebarilabs/.github/...@v2` and the moving v2 tag plus the
      # org sync propagate updates without Dependabot. TWO entries required:
      # reusable-workflow deps are named by full path (`nebarilabs/.github/
      # .github/workflows/...`) - a Nov 2025 behavior change (recorded in
      # dependabot-core issue #11263, formalized in PR #13449) made the bare
      # org/repo form stop matching them; bare-only ignores still failed
      # weekly jobs fleet-wide on 2026-11-09 and 2026-11-11. Bare form kept
      # for action-style refs.
      - dependency-name: "nebarilabs/.github"
      - dependency-name: "nebarilabs/.github/*"
    cooldown:
      # Release-age gate: a version younger than this is never proposed. GitHub's own default
      # is 3 days; majors wait longer because they can break APIs, patches wait so the
      # 5.12.5-to-5.12.6 class of noise stops re-filing every day. Version updates only:
      # security updates stay immediate.
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      # One PR per repo for action pins instead of one per action: matches how we
      # actually review them (as a set).
      all-action-pins:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: "daily"
    reviewers:
      - "nebarilabs/admins"
    cooldown:
      # Release-age gate: a version younger than this is never proposed. GitHub's own default
      # is 3 days; majors wait longer because they can break APIs, patches wait so the
      # 5.12.5-to-5.12.6 class of noise stops re-filing every day. Version updates only:
      # security updates stay immediate.
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      # Minor/patch bumps land as one PR per repo; majors stay individual because
      # they can carry breaking API changes that need real review.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: "daily"
    reviewers:
      - "nebarilabs/admins"
    cooldown:
      # Release-age gate: a version younger than this is never proposed. GitHub's own default
      # is 3 days; majors wait longer because they can break APIs, patches wait so the
      # 5.12.5-to-5.12.6 class of noise stops re-filing every day. Version updates only:
      # security updates stay immediate.
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      # Minor/patch bumps land as one PR per repo; majors (base images) stay
      # individual because they change the runtime everyone runs on.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Interpreter base-image MAJORS are never actionable here: the proposed
      # python:3.15-slim base broke wheel builds fleet-wide (graphify: "Failed
      # building wheel for tree-sitter"; voice-bridge: "onnxruntime>=1.31.1
      # ... from versions: none"), so Dependabot filing an interpreter major
      # only ever produces a red PR. Those bumps go into the Dockerfile by hand
      # once the code supports the new interpreter; minors (the 3.12.x class)
      # still arrive through the group above.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
