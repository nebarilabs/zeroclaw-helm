# Centrally managed by nebarilabs/.github — do not edit in this repo.
# The org sync (nebarilabs/.github .github/workflows/sync.yml) overwrites this
# file directly; downstream edits are silently lost. Propose changes upstream.
name: OpenCode PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review (workflow_dispatch; ignored on pull_request events)
        required: false
        type: number
permissions:
  pull-requests: write
  contents: read
jobs:
  review:
    uses: nebarilabs/.github/.github/workflows/opencode-review.yml@v2
    with:
      pr_number: ${{ github.event.number || inputs.pr_number }}
    secrets: inherit
