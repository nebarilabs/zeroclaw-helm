# The org sync (nebarilabs/.github .github/workflows/sync.yml) overwrites this
# file directly; downstream edits are silently lost. Propose changes upstream.
name: OpenCode PR Review
on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review (workflow_dispatch; ignored on pull_request events)
        required: false
        type: number
permissions:
  pull-requests: write
  contents: read
jobs:
  review:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/opencode'))
    uses: nebarilabs/.github/.github/workflows/opencode-review.yml@v2
    with:
      pr_number: ${{ github.event.number || inputs.pr_number || github.event.issue.number }}
    secrets: inherit